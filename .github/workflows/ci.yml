# Source: verified against docs.github.com/actions/tutorials/build-and-test-code/net
# and github.com/actions/runner-images/issues/13789 (MSBuild pinning)
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.1xx'

      - name: Restore dependencies
        run: dotnet restore GithubMCP.slnx

      - name: Build
        run: dotnet build GithubMCP.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test GithubMCP.slnx --no-build --configuration Release
